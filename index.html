<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counsel Desk</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">

  <header class="bg-white border-b border-blue-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex-shrink-0 flex items-center">
          <span class="text-xl font-bold text-blue-600">PyUIDev Studio</span>
        </div>

        <nav class="hidden md:flex space-x-6">
          <a href="#" class="text-blue-600 font-semibold transition-colors">Home</a>
          <a href="#" class="text-slate-600 hover:text-blue-600 font-medium transition-colors">Forms</a>
          <a href="#" class="text-slate-600 hover:text-blue-600 font-medium transition-colors">Settings</a>
        </nav>

        <div class="flex md:hidden">
          <button id="hamburger-btn" type="button" class="p-2 rounded-md text-slate-600 hover:text-blue-600 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-blue-100 px-4 pt-2 pb-4 space-y-2">
      <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-blue-600 bg-blue-50">Home</a>
      <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-slate-700 hover:text-blue-600 hover:bg-slate-50">Forms</a>
      <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-slate-700 hover:text-blue-600 hover:bg-slate-50">Settings</a>
      <div id="mobile-tab-options" class="border-t border-slate-100 pt-2 mt-2 space-y-1">
        </div>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex items-center justify-center">
    
    <div id="app-container" class="w-full bg-white border border-blue-100 rounded-xl p-8 shadow-md text-center space-y-4">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-blue-900">Welcome to Your Blue Theme Playground</h1>
      <p class="text-slate-600 max-w-md mx-auto">
        This is your blue-themed base SPA index file. Use your <code class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded font-mono text-sm border border-blue-200">PyUIDev</code> workflow to generate div components and plug them right into this layout.
      </p>
    </div>

  </main>

  <footer class="bg-white border-t border-blue-100 py-4 text-center text-sm text-slate-500">
    Powered by Tailwind CSS, jQuery, and PyUIDev.
  </footer>

  <script>
    $(document).ready(function() {
      // Toggle Mobile Hamburger Menu
      $('#hamburger-btn').on('click', function() {
        $('#mobile-menu').toggleClass('hidden');
      });

      // Close mobile menu when resizing to desktop view
      $(window).resize(function() {
        if ($(window).width() >= 768) {
          $('#mobile-menu').addClass('hidden');
        }
      });
    });
  </script>

</body>
</html>
